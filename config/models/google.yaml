# Google Gemini models (Nano Banana image family + Veo video family).
# Docs: https://ai.google.dev/gemini-api/docs/image-generation
#       https://ai.google.dev/gemini-api/docs/veo
#
# Each key under `models:` is the name you pass to `generate -m <name>`.
#   id            Model identifier sent to the Gemini API (defaults to the key).
#   kind          image | video   (default: image)
#   billing       metered (charged per call) | plan (subscription usage limits). Required.
#   description   Shown by `generate --list-models`.
#   aliases       Extra names accepted by --model (the raw `id` also resolves).
#   deprecated    Optional notice; printed as a warning when the model is used.
#   image_sizes   (image) imageSize values the model accepts: 512, 1K, 2K, 4K.
#                 Requests above the ceiling fall back to the largest allowed.
#                 Omit for models with no size control.
#   resolutions   (video) accepted resolutions, first is the default.
#                 1080p and 4k require an 8-second duration.
#
# `obsolete:` entries make `generate` refuse a retired name with a migration hint.

provider: google

models:
  nano-banana-2:
    id: gemini-3.1-flash-image
    kind: image
    billing: metered
    direct_price: { usd: 0.067, unit: image, source: "https://ai.google.dev/gemini-api/docs/pricing (1K, paid tier)", checked: 2026-10-04 }
    description: Gemini 3.1 Flash Image. Best overall default; 512 to 4K, fast, strong text rendering, up to 14 reference images.
    aliases: [gemini-3.1-flash-image, gemini-3.1-flash, gemini-flash]
    image_sizes: [512, 1K, 2K, 4K]

  nano-banana-pro:
    id: gemini-3-pro-image
    kind: image
    billing: metered
    direct_price: { usd: 0.134, unit: image, source: "https://ai.google.dev/gemini-api/docs/pricing (1K/2K, paid tier)", checked: 2026-10-04 }
    description: Gemini 3 Pro Image. Studio-grade precision for complex layouts and typography, 1K to 4K.
    aliases: [gemini-3-pro-image, gemini-3-pro, gemini-pro]
    image_sizes: [1K, 2K, 4K]

  nano-banana-2-lite:
    id: gemini-3.1-flash-lite-image
    kind: image
    billing: metered
    description: Gemini 3.1 Flash Lite Image. Sub-2s latency, 1K only, cheapest Gemini image model.
    aliases: [gemini-3.1-flash-lite-image, gemini-3.1-flash-lite, gemini-lite, nano-banana-lite]
    image_sizes: [1K]

  nano-banana:
    id: gemini-2.5-flash-image
    kind: image
    billing: metered
    description: Gemini 2.5 Flash Image. Legacy baseline, fixed ~1024px output, no size control.
    aliases: [gemini-2.5-flash-image, gemini-2.5-flash]
    deprecated: Shuts down 2026-10-02. Use nano-banana-2 or nano-banana-2-lite.

  veo-3.1:
    id: veo-3.1-generate-preview
    kind: video
    billing: metered
    direct_price: { usd: 0.40, unit: second, source: "https://ai.google.dev/gemini-api/docs/pricing (720p/1080p with audio)", checked: 2026-10-04 }
    description: Veo 3.1. Cinematic 720p/1080p/4k video, 16:9 or 9:16, 4-8s, image-to-video via -r.
    aliases: [veo, veo-3.1-generate-preview]
    resolutions: [720p, 1080p, 4k]

  veo-3.1-fast:
    id: veo-3.1-fast-generate-preview
    kind: video
    billing: metered
    direct_price: { usd: 0.10, unit: second, source: "https://ai.google.dev/gemini-api/docs/pricing (720p with audio; 1080p is 0.12)", checked: 2026-10-04 }
    description: Veo 3.1 Fast. Same features as Veo 3.1 with lower latency.
    aliases: [veo-fast, veo-3.1-fast-generate-preview]
    resolutions: [720p, 1080p, 4k]

  veo-3.1-lite:
    id: veo-3.1-lite-generate-preview
    kind: video
    billing: metered
    description: Veo 3.1 Lite. Fast 4-8s clips at 720p/1080p, text- and image-to-video only.
    aliases: [veo-lite, veo-3.1-lite-generate-preview]
    resolutions: [720p, 1080p]

obsolete:
  imagen-3:
    replacement: nano-banana-2
    reason: Imagen is shut down on the Gemini API. Use nano-banana-2 (Gemini 3.1 Flash Image) instead.
  imagen-3-fast:
    replacement: nano-banana-2-lite
    reason: Imagen is shut down on the Gemini API. Use nano-banana-2-lite (Gemini 3.1 Flash Lite Image) instead.
  imagen-3.0-generate-002:
    replacement: nano-banana-2
    reason: Imagen is shut down on the Gemini API. Use nano-banana-2 (Gemini 3.1 Flash Image) instead.
  imagen-3.0-fast-generate-001:
    replacement: nano-banana-2-lite
    reason: Imagen is shut down on the Gemini API. Use nano-banana-2-lite (Gemini 3.1 Flash Lite Image) instead.
  imagen-4:
    replacement: nano-banana-pro
    reason: Imagen 4 was shut down by Google on August 17, 2026. Use nano-banana-pro (Gemini 3 Pro Image) instead.
  imagen-4.0-generate-001:
    replacement: nano-banana-pro
    reason: Imagen 4 was shut down by Google on August 17, 2026. Use nano-banana-pro (Gemini 3 Pro Image) instead.
  imagen-4.0-ultra-generate-001:
    replacement: nano-banana-pro
    reason: Imagen 4 Ultra was shut down by Google on August 17, 2026. Use nano-banana-pro (Gemini 3 Pro Image) instead.
  imagen-4.0-fast-generate-001:
    replacement: nano-banana-2-lite
    reason: Imagen 4 Fast was shut down by Google on August 17, 2026. Use nano-banana-2-lite instead.
  gemini-3.1-flash-image-preview:
    replacement: nano-banana-2
    reason: The preview id was shut down on June 25, 2026. Use nano-banana-2 (gemini-3.1-flash-image) instead.
  gemini-3-pro-image-preview:
    replacement: nano-banana-pro
    reason: The preview id was shut down on June 25, 2026. Use nano-banana-pro (gemini-3-pro-image) instead.
  gemini-2.5-flash-image-preview:
    replacement: nano-banana-2
    reason: The preview id was shut down on January 15, 2026. Use nano-banana-2 instead.
  veo-2:
    replacement: veo-3.1
    reason: Veo 2.0 was shut down by Google on June 30, 2026. Use veo-3.1 instead.
  veo-2.0:
    replacement: veo-3.1
    reason: Veo 2.0 was shut down by Google on June 30, 2026. Use veo-3.1 instead.
  veo-2.0-generate-001:
    replacement: veo-3.1
    reason: Veo 2.0 was shut down by Google on June 30, 2026. Use veo-3.1 instead.
  veo-3:
    replacement: veo-3.1
    reason: Veo 3.0 was shut down by Google on June 30, 2026. Use veo-3.1 instead.
  veo-3.0-generate-001:
    replacement: veo-3.1
    reason: Veo 3.0 was shut down by Google on June 30, 2026. Use veo-3.1 instead.
  veo-3.0-fast-generate-001:
    replacement: veo-3.1-fast
    reason: Veo 3.0 Fast was shut down by Google on June 30, 2026. Use veo-3.1-fast instead.
