# OpenAI GPT Image models.
# API reference: https://developers.openai.com/api/docs/guides/image-generation
#
# Each key under `models:` is the name you pass to `generate -m <name>`.
#   id            Model identifier sent to the Images API (defaults to the key).
#   kind          image | video
#   billing       metered (charged per call) | plan (subscription usage limits). Required.
#   description   Shown by `generate --list-models`.
#   aliases       Extra names accepted by --model (snapshot ids go here).
#   deprecated    Optional notice; printed as a warning when the model is used.
#   edit          true if the model accepts reference images via /v1/images/edits.
#   size_mode     fixed    -> only the `sizes` list is accepted
#                 flexible -> any WIDTHxHEIGHT, both divisible by 16, within the
#                             max_edge / min_pixels / max_pixels limits below
#   sizes         Legal sizes when size_mode is fixed.
#   max_edge      Longest edge in pixels (flexible mode).
#   min_pixels    Minimum width*height (flexible mode).
#   max_pixels    Maximum width*height (flexible mode).
#   qualities     Values accepted by the API's `quality` param. The CLI maps
#                 `standard` -> medium and `hd` -> high before checking this list.
#
# `obsolete:` entries make `generate` refuse a removed model with a migration hint.

provider: openai

models:
  # https://developers.openai.com/api/docs/changelog (Nov 4) and guides/image-generation (read 2026-11-12):
  # same sizes and quality tiers as 2.5, same $30/M image output token rate (calculator: about $0.025 per image).
  # New request fields: complexity (low|medium|high), output_format svg (generations, n=1) and gif (--param).
  gpt-image-2.6-sunburst:
    id: gpt-image-2.6-sunburst
    kind: image
    billing: metered
    # Priced at high quality by size from Atlas /calculate for openai/gpt-image-2.6-* (2026-11-12; its 3840x2160 medium
    # quote is 825 tokens at OpenAI's $30/M, matching OpenAI's own calculator). Unlisted sizes (e.g. 3840x1648) take the
    # highest listed price. Quality ratios measured at 1024 to 3840: medium <= 0.34, xhigh 1.75, max 3.87; low is
    # unmeasured and priced as medium (over-quotes, never under).
    direct_price: { usd: 0.0896, unit: image, by_size: { 1024x1024: 0.0461, 1536x1024: 0.0369, 2048x2048: 0.0896, 2048x1152: 0.0379, 3840x2160: 0.0841 }, by_quality: { low: 0.34, medium: 0.34, high: 1, auto: 1, xhigh: 1.75, max: 3.87 }, source: "Atlas /calculate (openai/gpt-image-2.6-*, high quality)", checked: 2026-11-12 }
    description: GPT Image 2.6 Sunburst. OpenAI's current recommendation for detailed work and precise editing. --param complexity=low|medium|high.
    aliases: [gpt-image-2.6]
    edit: true
    size_mode: flexible
    max_edge: 3840
    min_pixels: 655360
    max_pixels: 8294400
    qualities: [low, medium, high, xhigh, max, auto]

  gpt-image-2.6-flare:
    id: gpt-image-2.6-flare
    kind: image
    billing: metered
    # Priced at high quality by size from Atlas /calculate for openai/gpt-image-2.6-* (2026-11-12; its 3840x2160 medium
    # quote is 825 tokens at OpenAI's $30/M, matching OpenAI's own calculator). Unlisted sizes (e.g. 3840x1648) take the
    # highest listed price. Quality ratios measured at 1024 to 3840: medium <= 0.34, xhigh 1.75, max 3.87; low is
    # unmeasured and priced as medium (over-quotes, never under).
    direct_price: { usd: 0.0896, unit: image, by_size: { 1024x1024: 0.0461, 1536x1024: 0.0369, 2048x2048: 0.0896, 2048x1152: 0.0379, 3840x2160: 0.0841 }, by_quality: { low: 0.34, medium: 0.34, high: 1, auto: 1, xhigh: 1.75, max: 3.87 }, source: "Atlas /calculate (openai/gpt-image-2.6-*, high quality)", checked: 2026-11-12 }
    description: GPT Image 2.6 Flare. Fast 2.6 model for everyday generation. --param complexity=low|medium|high.
    edit: true
    size_mode: flexible
    max_edge: 3840
    min_pixels: 655360
    max_pixels: 8294400
    qualities: [low, medium, high, xhigh, max, auto]

  gpt-image-2.5-sunburst:
    id: gpt-image-2.5-sunburst
    kind: image
    billing: metered
    description: GPT Image 2.5 Sunburst. Highest quality; best for editing precision and inpainting.
    aliases: [gpt-image-2.5, sunburst, gpt-image-2.5-sunburst-2026-09-08]
    edit: true
    size_mode: flexible
    max_edge: 3840
    min_pixels: 655360
    max_pixels: 8294400
    qualities: [low, medium, high, xhigh, max, auto]

  gpt-image-2.5-flare:
    id: gpt-image-2.5-flare
    kind: image
    billing: metered
    description: GPT Image 2.5 Flare. Fastest 2.5 model for high-quality everyday generation.
    aliases: [flare, gpt-image-2.5-flare-2026-09-08]
    edit: true
    size_mode: flexible
    max_edge: 3840
    min_pixels: 655360
    max_pixels: 8294400
    qualities: [low, medium, high, xhigh, max, auto]

  gpt-image-1.5:
    id: gpt-image-1.5
    kind: image
    billing: metered
    description: GPT Image 1.5. Fixed sizes only.
    deprecated: Shuts down 2026-12-01. Use gpt-image-2.6-sunburst or gpt-image-2.6-flare.
    edit: true
    size_mode: fixed
    sizes: [1024x1024, 1536x1024, 1024x1536, auto]
    qualities: [low, medium, high, auto]

  gpt-image-1-mini:
    id: gpt-image-1-mini
    kind: image
    billing: metered
    description: GPT Image 1 Mini. Low-cost previous-generation model, fixed sizes only.
    deprecated: Shuts down 2026-12-01. Use gpt-image-2.6-flare.
    edit: false
    size_mode: fixed
    sizes: [1024x1024, 1536x1024, 1024x1536, auto]
    qualities: [low, medium, high, auto]

obsolete:
  gpt-image-2:
    replacement: gpt-image-2.6-sunburst
    reason: gpt-image-2 is retired here ahead of OpenAI's 2027-02-10 shutdown. Use gpt-image-2.6-sunburst (same sizes, cheaper per image), or codex-image for the Codex plan route.
  gpt-image-2-2026-04-21:
    replacement: gpt-image-2.6-sunburst
    reason: gpt-image-2 is retired here ahead of OpenAI's 2027-02-10 shutdown. Use gpt-image-2.6-sunburst instead.
  gpt-image-1:
    replacement: gpt-image-2.6-sunburst
    reason: gpt-image-1 was shut down by OpenAI on October 23, 2026. Use gpt-image-2.6-sunburst or gpt-image-2.6-flare instead.
  dall-e-3:
    replacement: gpt-image-2.6-sunburst
    reason: DALL-E 3 was removed from the OpenAI API on May 12, 2026. Use gpt-image-2.6-sunburst instead.
  dall-e-2:
    replacement: gpt-image-2.6-flare
    reason: DALL-E 2 was removed from the OpenAI API on May 12, 2026. Use gpt-image-2.6-flare instead.
  chatgpt-image-latest:
    replacement: gpt-image-2.6-sunburst
    reason: chatgpt-image-latest is deprecated (shutdown December 1, 2026). Use gpt-image-2.6-sunburst instead.
